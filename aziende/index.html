<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collaborazione commerciale nel settore pet</title>
<meta name="description" content="PetVerse, progetto imprenditoriale in fase di studio nell'Executive MBA del Politecnico di Milano: raccolta informazioni per aziende del settore pet. Circa 4 minuti.">
<meta property="og:title" content="Collaborazione commerciale nel settore pet">
<meta property="og:description" content="PetVerse, progetto imprenditoriale in fase di studio nell'Executive MBA del Politecnico di Milano: raccolta informazioni per aziende del settore pet. Circa 4 minuti.">
<meta name="theme-color" content="#07060C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307060C'/%3E%3Ccircle cx='16' cy='17' r='9' fill='%23A855F7'/%3E%3Cellipse cx='16' cy='17' rx='14' ry='4' fill='none' stroke='%23FF3EA5' stroke-width='2' transform='rotate(-15 16 17)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Stessa identità visiva del questionario per i proprietari (cielo scuro, gradiente viola→rosa→corallo),
   senza elementi di gioco: una domanda per schermata, avanzamento per sezioni, riepilogo e invio. */
:root {
  color-scheme: dark;
  --bg: #07060C; --surface: #15131F; --surface-2: #1F1C2E; --line: #2E2A44;
  --text: #EEEEFF; --muted: #AAAACC; --violet: #7C3AED; --purple: #A855F7; --pink: #FF3EA5; --coral: #FF7A6B; --magenta: #DB2777;
  --grad: linear-gradient(90deg, #7C3AED 0%, #A855F7 35%, #FF3EA5 70%, #FF7A6B 100%);
  --accent: #7C3AED;
  --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; color: var(--text); font: 17px/1.5 var(--body); min-height: 100dvh;
  background: radial-gradient(90% 50% at 25% -10%, rgba(124, 58, 237, .32), transparent 70%), radial-gradient(70% 40% at 100% 0%, rgba(255, 62, 165, .16), transparent 70%), var(--bg);
  background-repeat: no-repeat;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sky i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #FFFFFF; opacity: var(--o); animation: tw var(--d) ease-in-out infinite alternate; }
@keyframes tw { to { opacity: .08; } }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-block: 18px 40px; min-height: 100dvh; display: flex; flex-direction: column; }
#app { display: flex; flex-direction: column; gap: 18px; flex: 1; }
#app.in { animation: sceneIn .55s cubic-bezier(.16, 1, .3, 1) backwards; }
#app.back { animation: sceneBack .5s cubic-bezier(.16, 1, .3, 1) backwards; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(12px); } }
@keyframes sceneBack { from { opacity: 0; transform: translateY(-10px); } }
h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); text-wrap: balance; }
h1 { font-weight: 700; font-size: clamp(28px, 7.4vw, 36px); line-height: 1.08; letter-spacing: -.015em; }
h2 { font-weight: 600; font-size: clamp(21px, 5.6vw, 26px); line-height: 1.2; letter-spacing: -.01em; }
h1:focus, h2:focus { outline: none; }
:focus-visible { outline: 3px solid #C9A6FF; outline-offset: 3px; }
.lead { font-size: 18px; line-height: 1.45; color: var(--muted); }
.kicker { font: 600 12.5px/1.3 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.fine { font-size: 14px; color: var(--muted); }
.gradtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wordmark { font: 500 22px/1 var(--display); letter-spacing: .34em; }
.wordmark span { background: linear-gradient(90deg, #8B5CF6, #FF3EA5 60%, #FF7A6B); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rulegrad { height: 2px; background: var(--grad); border-radius: 2px; width: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font: 600 14.5px/1.4 var(--body); color: var(--muted); }
.panel { border-radius: 18px; padding: 15px 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.panel b.t { font: 600 17px var(--display); }
.panel .abt { font-size: 15.5px; line-height: 1.5; color: var(--muted); }
.panel .abt strong { color: var(--text); font-weight: 600; }
.panel ol, .panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.gborder { border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; }

/* barra in alto: indietro + sezioni */
.top { display: flex; flex-direction: column; gap: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.backbtn { background: none; border: 0; color: var(--muted); font: 600 15px var(--body); padding: 6px 2px; cursor: pointer; }
.count { font: 600 14px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.secbar { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
.seg { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.seg i { display: block; height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.seg i b { display: block; height: 100%; width: var(--w); background: var(--grad); border-radius: 999px; transition: width .6s cubic-bezier(.16, 1, .3, 1); }
.seg span { font: 600 11.5px/1.2 var(--body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.now span { color: var(--text); }

/* domanda */
.section { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; background: color-mix(in srgb, var(--accent) 20%, transparent); color: #E2CCFF; border-radius: 999px; padding: 3px 12px; font: 600 14px/1.4 var(--body); }
.hint { font-size: 15px; font-weight: 600; color: #C9A6FF; margin-top: -8px; }
.note { border-radius: 14px; padding: 12px 14px; background: var(--surface-2); color: var(--muted); border-left: 3px solid var(--accent); }
.concept { border-radius: 16px; padding: 14px 16px; font-size: 16px; }
.concept b { display: block; font: 600 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: #FF9ACB; margin-bottom: 6px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  position: relative; overflow: hidden; display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--text); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 12px;
  font: 500 16.5px/1.35 var(--body); box-shadow: 0 3px 0 #000; touch-action: manipulation;
  transition: transform .2s cubic-bezier(.16, 1, .3, 1), box-shadow .25s, background-color .25s, border-color .25s, opacity .3s;
  animation: rise .4s cubic-bezier(.16, 1, .3, 1) backwards; animation-delay: calc(var(--i) * 35ms + 40ms);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@media (hover: hover) { .opt:hover { border-color: var(--accent); transform: translateY(-1px); } }
.opt.sel { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border: 2px solid var(--accent); transform: translateY(2px); box-shadow: 0 1px 0 #000, 0 10px 30px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
.opts.decided .opt:not(.sel) { opacity: .45; }
.opt .n { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: #C9A6FF; font: 700 14px/1 var(--display); }
.opts.multi .opt .n { border-radius: 50%; }
.opt.sel .n { background: var(--accent); color: #FFFFFF; }
.opt .n svg { width: 17px; height: 17px; }
.opt.full { opacity: .45; }
.field { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); font: 500 17px/1.45 var(--body); padding: 13px 14px; }
.field::placeholder { color: #6E6A8A; }
textarea.field { min-height: 130px; resize: vertical; }
select.field { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
select.field option { background: #15131F; color: #EEEEFF; }
.error { background: rgba(219, 39, 119, .14); color: #FF9ACB; border: 1.5px solid var(--magenta); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.btn {
  position: relative; overflow: hidden; width: 100%; cursor: pointer; border: 0; border-radius: 14px; padding: 15px 22px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--violet); color: #FFFFFF; font: 600 18.5px/1.2 var(--display); box-shadow: 0 4px 0 #4C1D95, 0 10px 26px rgba(124, 58, 237, .3);
  transition: transform .18s cubic-bezier(.16, 1, .3, 1), box-shadow .3s, opacity .3s; touch-action: manipulation;
}
.btn.grad { background: var(--grad); box-shadow: 0 4px 0 #6B1B4F, 0 10px 30px rgba(255, 62, 165, .25); }
.btn::after { content: "→"; font-size: 19px; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:disabled::after { content: none; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); box-shadow: none; color: var(--text); }
.btn.ghost::after { content: none; }
.push { margin-top: auto; }
.row { display: flex; flex-direction: column; gap: 10px; }
.skip { align-self: center; background: none; border: 0; color: var(--muted); font: 600 15px var(--body); text-decoration: underline; text-underline-offset: 4px; padding: 8px 4px; cursor: pointer; }
.testbar { background: var(--surface-2); color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 12px; }
.consent { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; cursor: pointer; background: var(--surface); color: var(--text); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; font: 500 15.5px/1.45 var(--body); }
.consent.sel { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.consent .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; margin-top: 1px; }
.consent.sel .box { background: var(--accent); border-color: var(--accent); }
.consent .box svg { width: 16px; height: 16px; }

/* riepilogo */
.rv { display: flex; flex-direction: column; gap: 14px; }
.rvsec { display: flex; flex-direction: column; gap: 6px; }
.rvsec h3 { margin: 0; font: 600 13px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.rvq { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.rvq.miss { border-color: var(--magenta); }
.rvq p { font-size: 14.5px; color: var(--muted); }
.rvq strong { display: block; font-weight: 600; font-size: 15.5px; color: var(--text); margin-top: 2px; overflow-wrap: anywhere; }
.rvq button { flex: none; background: none; border: 0; color: #C9A6FF; font: 600 14px var(--body); cursor: pointer; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* fine */
.hero { display: flex; flex-direction: column; gap: 12px; }
.badge { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--grad); box-shadow: 0 0 40px rgba(168, 85, 247, .45); animation: pop .8s cubic-bezier(.3, 1.4, .5, 1) backwards; }
.badge svg { width: 34px; height: 34px; color: #FFFFFF; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
.linkbox { display: flex; gap: 8px; }
.linkbox input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 10px; font: 500 14px var(--body); background: var(--surface-2); color: var(--text); }
.linkbox button { flex: none; border: 0; border-radius: 12px; background: var(--violet); color: #FFFFFF; font: 600 15px var(--display); padding: 6px 16px; cursor: pointer; }
.foot { margin-top: 22px; font-size: 12.5px; color: #77749A; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* logo PetVerse (stesso del questionario per i proprietari, in versione più compatta) */
.cover { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pets { position: relative; width: min(100%, 210px); aspect-ratio: 520 / 425; isolation: isolate; margin-bottom: -6px; animation: petsIn 1.4s cubic-bezier(.16, 1, .3, 1) backwards; }
.pets::before { content: ""; position: absolute; inset: 10% 14%; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(168, 85, 247, .5), rgba(255, 62, 165, .16) 60%, transparent); filter: blur(20px); }
.pets img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-mask-image: radial-gradient(closest-side at 50% 48%, #000 62%, transparent 100%); mask-image: radial-gradient(closest-side at 50% 48%, #000 62%, transparent 100%); animation: floaty 7s ease-in-out infinite; }
@keyframes petsIn { from { opacity: 0; transform: translateY(20px) scale(.94); filter: blur(10px); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.cover .wordmark { font-size: clamp(26px, 8vw, 34px); margin-right: -.34em; }
.tagline { font: 500 11.5px/1.3 var(--display); letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.tagline span { color: var(--purple); }
.cover .rulegrad { width: 120px; }
</style>
</head>

const FORM_ACTION = "https://docs.google.com/forms/d/" + FORM.action + "/formResponse";
/* Invio reale solo dalla pagina pubblicata su GitHub; altrove (anteprime, ?prova) è modalità prova. */
const LIVE = /\.github\.io$/.test(location.hostname) && !/prova/.test(location.search);
/* ---------- Contatore anonimo (form tecnico "PetVerse — contatore questionari"):
   apertura, inizio, avanzamento e invio. Nessun dato personale: evento, codice di sessione casuale, canale (?c=...).
   In modalità prova non invia nulla. ---------- */
const TRACK = { url: "https://docs.google.com/forms/d/e/1FAIpQLSdhWytdeSI7Ly8nDg7nHvTjBfSLMPKqJojRH_qUH3_qxoPEWw/formResponse",
  q: "entry.1369122169", e: "entry.221137339", s: "entry.14560769", c: "entry.1846281880", survey: "aziende" };
const TRACK_SID = (function () {
  const k = "petverse_sid_" + TRACK.survey;
  try { let v = localStorage.getItem(k); if (!v) { v = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(k, v); } return v; }
  catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
})();
const TRACK_CH = (new URLSearchParams(location.search).get("c") || "diretto").replace(/[^\w-]/g, "").slice(0, 40);
const trackedEv = {};
function track(ev) {
  if (trackedEv[ev]) return; trackedEv[ev] = 1;
  if (!LIVE) { console.log("[contatore, prova]", TRACK.survey, ev, TRACK_CH); return; }
  try {
    const b = new URLSearchParams();
    b.append(TRACK.q, TRACK.survey); b.append(TRACK.e, ev); b.append(TRACK.s, TRACK_SID); b.append(TRACK.c, TRACK_CH);
    b.append("fvv", "1"); b.append("pageHistory", "0");
    fetch(TRACK.url, { method: "POST", mode: "no-cors", body: b, keepalive: true }).catch(function () {});
  } catch (e) { /* il contatore non deve mai bloccare il questionario */ }
}
track("apertura");

const STORE = CFG.store;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* Normalizza le domande: tipo, opzioni, salti, massimo di scelte, email. */
const Q = FORM.items.map((it, k) => {
  const nav = it.o.some(o => Array.isArray(o));
  const opts = it.o.map(o => Array.isArray(o) ? o[0] : o);
  const to = nav ? it.o.map(o => o[1]) : null;
  let max = null, email = false;
  (it.v || []).forEach(v => { if (v[0] === 7 && v[1] === 201) max = Number(v[2][0]); if (v[0] === 2 && v[1] === 102) email = true; });
  let type = { 0: "text", 1: "long", 2: "single", 3: "single", 4: "multi" }[it.ty];
  if (it.ty === 3 && opts.length > 12) type = "select";
  if (it.ty === 4 && opts.length === 1 && /^Consenso/.test(it.t)) type = "consent";
  return { id: "q" + (k + 1), k: k, page: it.p, title: it.t, help: it.h, entry: it.e, req: !!it.r, type: type, opts: opts, to: to, max: max, email: email };
});
const PAGES = FORM.pages.map((p, i) => ({ i: i, id: p.id, title: i === 0 ? CFG.firstSection : p.t, help: p.h }));
const SECTIONS = CFG.sections; /* sezioni mostrate nella barra: indici delle pagine del modulo */

(function sky() {
  let h = "";
  for (let i = 0; i < 60; i++) h += '<i style="left:' + (Math.random() * 100).toFixed(1) + "%;top:" + (Math.random() * 100).toFixed(1) + "%;--s:" + (Math.random() < .15 ? 2.4 : 1.3) + "px;--o:" + (.2 + Math.random() * .5).toFixed(2) + ";--d:" + (2 + Math.random() * 3).toFixed(1) + 's"></i>';
  document.getElementById("sky").innerHTML = h;
})();
document.getElementById("testbar").hidden = LIVE;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }
function fresh() { return { at: "intro", a: {}, sent: 0, t0: 0 }; }
function load() { try { const v = localStorage.getItem(STORE); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* memoria non disponibile: il questionario funziona lo stesso */ } }
let state = load() || fresh();
if (!state.a) state = fresh();
let dir = 1, busy = false, sendError = "", timer = 0;
const app = document.getElementById("app");

/* Percorso tra le sezioni del modulo, come in Google Form: la domanda con salto decide la sezione successiva. */
function pagePath() {
  const seen = [0]; let p = 0, guard = 0;
  while (guard++ < 50) {
    const navQ = Q.find(q => q.page === p && q.to);
    let next;
    if (navQ) {
      const v = state.a[navQ.id];
      if (typeof v !== "number") break;
      const t = navQ.to[v];
      if (t === -3) break;
      next = PAGES.findIndex(pg => pg.id === t);
      if (next < 0) next = p + 1;
    } else next = p + 1;
    if (next >= PAGES.length) break;
    p = next; seen.push(p);
  }
  return seen;
}
function visibleQs() { const pp = pagePath(); return Q.filter(q => pp.indexOf(q.page) >= 0); }
function hasAnswer(q) {
  const v = state.a[q.id];
  if (q.type === "multi" || q.type === "consent") return Array.isArray(v) && v.length > 0;
  if (q.type === "text" || q.type === "long") return typeof v === "string" && v.trim() !== "";
  return typeof v === "number";
}
function steps() { return ["intro"].concat(visibleQs().map(q => "q:" + q.id), ["review"]); }
function byId(id) { return Q.find(q => q.id === id); }
function sectionOf(page) { let s = 0; SECTIONS.forEach((pg, i) => { if (page >= pg) s = i; }); return s; }

function go(d) {
  clearTimeout(timer);
  const s = steps(); let i = s.indexOf(state.at); if (i < 0) i = 0;
  i = Math.min(Math.max(i + d, 0), s.length - 1);
  state.at = s[i]; dir = d; sendError = ""; save(); render();
}
function animate() { app.classList.remove("in", "back"); void app.offsetWidth; app.classList.add(dir > 0 ? "in" : "back"); }
function focusHead() { const h = app.querySelector("h1, h2"); if (h) h.focus({ preventScroll: true }); window.scrollTo(0, 0); }

function render() {
  if (!state.sent) { if (state.at.indexOf("q:") === 0) { const tq = byId(state.at.slice(2)); if (tq) track("sezione_" + (sectionOf(tq.page) + 1)); } else if (state.at === "review") track("riepilogo"); }
  if (state.sent) renderThanks();
  else if (state.at === "intro") renderIntro();
  else if (state.at === "review") renderReview();
  else { const q = byId(state.at.slice(2)); if (q && visibleQs().indexOf(q) >= 0) renderQ(q); else { state.at = "intro"; renderIntro(); } }
  animate();
}

function secbar(curPage) {
  const vq = visibleQs(); const cur = sectionOf(curPage);
  let h = '<div class="secbar" style="--n:' + SECTIONS.length + '">';
  SECTIONS.forEach((pg, i) => {
    const qs = vq.filter(q => sectionOf(q.page) === i);
    const done = qs.filter(hasAnswer).length;
    const w = qs.length ? Math.round(100 * done / qs.length) : (i < cur ? 100 : 0);
    h += '<div class="seg' + (i === cur ? " now" : "") + '"><i><b style="--w:' + w + '%"></b></i><span>' + esc(CFG.secLabels[i]) + "</span></div>";
  });
  return h + "</div>";
}

function renderIntro() {
  const started = Object.keys(state.a).length > 0;
  app.innerHTML =
    '<div class="cover"><div class="pets"><img src="' + PETS_IMG + '" alt="Un cane, un gatto e un coniglio impilati, il logo di PetVerse"></div>' +
    '<p class="wordmark" aria-label="PetVerse">PET<span>VERSE</span></p><p class="tagline">From pet <span>care to pet universe</span></p><div class="rulegrad"></div></div>' +
    '<p class="kicker">' + esc(CFG.kicker) + "</p>" +
    '<h1 tabindex="-1">' + CFG.h1 + "</h1>" +
    '<p class="lead">' + esc(CFG.lead) + "</p>" +
    '<div class="chips">' + CFG.chips.map(c => '<span class="chip">' + esc(c) + "</span>").join("") + "</div>" +
    '<div class="panel gborder"><b class="t">' + esc(CFG.about.title) + '</b>' + CFG.about.paras.map(t => '<p class="abt">' + t + '</p>').join("") + '</div>' +
    '<div class="panel"><b class="t">Come funziona</b><ul>' + CFG.how.map(t => "<li>" + t + "</li>").join("") + "</ul></div>" +
    '<div class="row push"><button class="btn grad" id="go" type="button">' + (started ? "Riprendi da dove eri" : "Inizia") + "</button>" +
    (started ? '<button class="skip" id="restart" type="button">Ricomincia da capo</button>' : "") + "</div>" +
    '<p class="fine">' + esc(FORM.desc) + "</p>";
  document.getElementById("go").onclick = () => {
    if (!started) { state.t0 = Date.now(); track("inizio"); go(1); return; }
    const next = visibleQs().find(q => !hasAnswer(q) && q.type !== "long");
    track("ripresa"); state.at = next ? "q:" + next.id : "review"; dir = 1; save(); render();
  };
  const rs = document.getElementById("restart");
  if (rs) rs.onclick = () => { state = fresh(); save(); dir = -1; render(); };
  focusHead();
}

function typeHint(q) {
  if (q.type === "single") return "Una sola risposta";
  if (q.type === "multi") return q.max ? "Fino a " + q.max + " risposte" : "Puoi sceglierne più di una";
  if (q.type === "select") return "Scegli dal menu";
  if (q.type === "long") return "Facoltativa";
  return "";
}

function renderQ(q) {
  const vq = visibleQs(); const pos = vq.indexOf(q) + 1;
  const page = PAGES[q.page];
  const firstOfPage = vq.filter(x => x.page === q.page)[0] === q;
  let body = "";
  const v = state.a[q.id];
  if (q.type === "single") {
    body = '<div class="opts' + (typeof v === "number" ? " decided" : "") + '" role="radiogroup">' + q.opts.map((t, i) =>
      '<button type="button" role="radio" class="opt' + (v === i ? " sel" : "") + '" aria-checked="' + (v === i) + '" data-i="' + i + '" style="--i:' + i + '"><span class="n">' + (v === i ? CHECK : String.fromCharCode(65 + i)) + "</span><span>" + esc(t) + "</span></button>").join("") + "</div>";
  } else if (q.type === "multi") {
    const a = v || [];
    body = '<div class="opts multi" role="group">' + q.opts.map((t, i) => {
      const sel = a.indexOf(i) >= 0, full = q.max && a.length >= q.max && !sel;
      return '<button type="button" class="opt' + (sel ? " sel" : "") + (full ? " full" : "") + '" aria-pressed="' + sel + '" data-i="' + i + '" style="--i:' + i + '"><span class="n">' + (sel ? CHECK : String.fromCharCode(65 + i)) + "</span><span>" + esc(t) + "</span></button>";
    }).join("") + "</div>" + '<button class="btn" id="next" type="button"' + (a.length ? "" : " disabled") + ">" + (a.length ? "Avanti" : "Scegli almeno una risposta") + "</button>";
  } else if (q.type === "select") {
    body = '<select class="field" id="f" aria-label="' + esc(q.title) + '"><option value="">Scegli…</option>' + q.opts.map((t, i) => '<option value="' + i + '"' + (v === i ? " selected" : "") + ">" + esc(t) + "</option>").join("") + "</select>" +
      '<button class="btn" id="next" type="button"' + (typeof v === "number" ? "" : " disabled") + ">Avanti</button>";
  } else if (q.type === "consent") {
    const on = Array.isArray(v) && v.length > 0;
    body = '<button type="button" class="consent' + (on ? " sel" : "") + '" id="cons" aria-pressed="' + on + '"><span class="box">' + (on ? CHECK : "") + "</span><span>" + esc(q.opts[0]) + "</span></button>" +
      '<button class="btn" id="next" type="button"' + (on ? "" : " disabled") + ">" + (on ? "Avanti" : "Serve il consenso per lasciare il contatto") + "</button>";
  } else {
    const val = typeof v === "string" ? v : "";
    body = (q.type === "long"
      ? '<textarea class="field" id="f" placeholder="Scrivi qui, se vuoi">' + esc(val) + "</textarea>"
      : '<input class="field" id="f" type="' + (q.email ? "email" : "text") + '" autocomplete="' + (q.email ? "email" : "off") + '" placeholder="' + (q.email ? "nome@azienda.it" : "Email, telefono o profilo LinkedIn") + '" value="' + esc(val) + '">') +
      '<div id="err" class="error" hidden></div><div class="row"><button class="btn" id="next" type="button">Avanti</button>' +
      (q.req ? "" : '<button class="skip" id="skip" type="button">Salta questa domanda</button>') + "</div>";
  }
  app.innerHTML =
    '<div class="top"><div class="toprow"><button class="backbtn" id="back" type="button">&larr; Indietro</button><span class="count">Domanda ' + pos + " di " + vq.length + "</span></div>" + secbar(q.page) + "</div>" +
    '<span class="section">' + esc(page.title) + "</span>" +
    (firstOfPage && page.help && q.page === CFG.conceptPage ? '<div class="concept gborder"><b>L\'idea</b>' + esc(page.help) + "</div>" : "") +
    '<h2 tabindex="-1">' + esc(q.title) + "</h2>" +
    (typeHint(q) ? '<p class="hint">' + typeHint(q) + "</p>" : "") +
    (q.help ? '<p class="note">' + esc(q.help) + "</p>" : "") + body;
  document.getElementById("back").onclick = () => go(-1);

  if (q.type === "single") {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = Number(b.getAttribute("data-i"));
      state.a[q.id] = i; save();
      app.querySelectorAll(".opt").forEach((x, k2) => { const on = x === b; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); x.querySelector(".n").innerHTML = on ? CHECK : String.fromCharCode(65 + k2); });
      app.querySelector(".opts").classList.add("decided");
      clearTimeout(timer); timer = setTimeout(() => go(1), 380);
    });
  } else if (q.type === "multi") {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = Number(b.getAttribute("data-i")); let a = (state.a[q.id] || []).slice();

    document.getElementById("next").onclick = () => go(1);
  } else {
    const f = document.getElementById("f"), err = document.getElementById("err");
    f.oninput = () => { state.a[q.id] = f.value; save(); err.hidden = true; };
    if (q.type === "text") f.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("next").click(); } };

      if (!q.email && q.req && val.length < 5) { err.textContent = "Il contatto sembra incompleto: scrivi un'email, un numero di telefono o il link al profilo LinkedIn."; err.hidden = false; return; }
      go(1);
    };
    const sk = document.getElementById("skip"); if (sk) sk.onclick = () => { delete state.a[q.id]; go(1); };
  }

function answerText(q) {
  const v = state.a[q.id];
  if (!hasAnswer(q)) return "";
  if (q.type === "multi") return v.map(i => q.opts[i]).join(" · ");
  if (q.type === "consent") return "Consenso dato";
  if (q.type === "text" || q.type === "long") return v.trim();
  return q.opts[v];
}
function missing() { return visibleQs().filter(q => q.req && !hasAnswer(q)); }

    const qs = vq.filter(q => sectionOf(q.page) === i); if (!qs.length) return;
    h += '<div class="rvsec"><h3>' + esc(CFG.secLabels[i]) + "</h3>" + qs.map(q =>
      '<div class="rvq' + (q.req && !hasAnswer(q) ? " miss" : "") + '"><div><p>' + esc(q.title) + "</p><strong>" + esc(answerText(q) || (q.req ? "Manca la risposta" : "—")) + "</strong></div>" +
      '<button type="button" data-q="' + q.id + '">Modifica</button></div>').join("") + "</div>";
  });
  h += "</div>";
  app.innerHTML =
    '<div class="top"><div class="toprow"><button class="backbtn" id="back" type="button">&larr; Indietro</button><span class="count">Riepilogo</span></div>' + secbar(PAGES.length - 1) + "</div>" +
    '<h1 tabindex="-1">Tutto a posto?</h1>' +
    '<p class="lead">' + (miss.length ? "Manca ancora qualche risposta obbligatoria: toccala qui sotto per completarla." : "Controlla le risposte e invia. Puoi ancora modificarle.") + "</p>" +
    h + (sendError ? '<div class="error">' + esc(sendError) + "</div>" : "") +
    '<button class="btn grad push" id="send" type="button"' + (miss.length ? " disabled" : "") + ">Invia le risposte</button>";
  document.getElementById("back").onclick = () => go(-1);
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { state.at = "q:" + b.getAttribute("data-q"); dir = -1; save(); render(); });
  document.getElementById("send").onclick = send;
  focusHead();
}

/* Corpo della richiesta al Google Form: una voce per domanda, le scelte multiple ripetono il campo. */
function formBody() {
  const body = new URLSearchParams();
  visibleQs().forEach(q => {
    if (!hasAnswer(q)) return;
    const name = "entry." + q.entry, v = state.a[q.id];
    if (q.type === "multi" || q.type === "consent") v.forEach(i => body.append(name, q.opts[i]));
    else if (q.type === "text" || q.type === "long") body.append(name, v.trim());
    else body.append(name, q.opts[v]);
  });
  body.append("pageHistory", pagePath().join(","));
  body.append("fvv", "1");
  return body;
}
function send() {
  if (busy) return;
  const btn = document.getElementById("send"); busy = true; btn.disabled = true; btn.textContent = "Invio in corso…";
  const finish = ok => {
    busy = false;
    if (ok) {
      track("invio"); state.called = pagePath().indexOf(PAGES.length - 1) >= 0; state.sent = Date.now();
      Q.filter(q => q.type === "text").forEach(q => delete state.a[q.id]); /* il contatto non resta nel browser */
      save(); dir = 1; render();
    } else { sendError = "Non siamo riusciti a inviare le risposte. Controlla la connessione e riprova."; renderReview(); }
  };
  const body = formBody();
  if (!LIVE) { console.log("[Questionario] modalità prova, dati che verrebbero inviati:", body.toString()); setTimeout(() => finish(true), 400); return; }
  fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: body }).then(() => finish(true), () => finish(false));
}

function renderThanks() {
  const link = CFG.shareUrl || (location.origin + location.pathname);
  app.innerHTML =
    '<div class="hero"><div class="badge">' + CHECK + "</div>" +
    '<p class="kicker">Risposte registrate</p><h1 tabindex="-1">' + CFG.thanksTitle + "</h1>" +
    '<p class="lead">' + esc(state.called ? CFG.thanksContact : CFG.thanksText) + "</p></div>" +
    (CFG.share ? '<div class="panel"><b class="t">' + esc(CFG.shareTitle) + '</b><p class="fine">' + esc(CFG.shareText) + "</p>" +
      '<div class="linkbox"><input id="share" type="text" readonly value="' + esc(link) + '" aria-label="Link al questionario"><button id="copy" type="button">Copia</button></div></div>' : "") +
    (!LIVE ? '<button class="skip" id="again" type="button">Ricomincia (solo in modalità prova)</button>' : "");
  const cp = document.getElementById("copy");
  if (cp) cp.onclick = () => {
    const inp = document.getElementById("share");
    const ok = () => { cp.textContent = "Copiato"; };
    const fb = () => { inp.focus(); inp.select(); cp.textContent = "Premi Ctrl+C"; };
    try { if (navigator.share && matchMedia("(pointer: coarse)").matches) navigator.share({ title: CFG.ogTitle, url: link }).then(ok, () => {}); else navigator.clipboard.writeText(link).then(ok, fb); } catch (e) { fb(); }
  };
  const ag = document.getElementById("again"); if (ag) ag.onclick = () => { state = fresh(); save(); dir = -1; render(); };
  focusHead();
}
render();
</script>
