<style>
/* Layout: the PetVerse pitch world ("from pet care to pet universe"). Near-black starfield, the violet→pink→coral brand gradient,
   a spaced PETVERSE wordmark. One centred column. The survey is a trip across five planets, each shaped like a pet-care object
   (tag, kibble, bone, yarn ball, tennis ball); every answer lights a star; the Pet Avatar travels the map and unlocks one accessory per planet.
   Single visual world by choice: the brand is dark, so the page is dark in both themes. */
:root {
  color-scheme: dark;
  --bg: #07060C;
  --surface: #15131F;
  --surface-2: #1F1C2E;
  --line: #2E2A44;
  --text: #EEEEFF;
  --muted: #AAAACC;
  --violet: #7C3AED;
  --purple: #A855F7;
  --magenta: #DB2777;
  --pink: #FF3EA5;
  --coral: #FF7A6B;
  --gold: #F7C948;
  --teal: #14B8A6;
  --grad: linear-gradient(90deg, #7C3AED 0%, #A855F7 35%, #FF3EA5 70%, #FF7A6B 100%);
  --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --accent: var(--purple);
  --accent-text: #C9A6FF;
  --glow: rgba(124, 58, 237, .38);
  --glow-2: rgba(255, 62, 165, .22);
}
body[data-round="pet"]      { --accent: var(--violet);  --accent-text: #B794FF; --glow: rgba(124, 58, 237, .5);  --glow-2: rgba(247, 201, 72, .1); }
body[data-round="bisogni"]  { --accent: var(--purple);  --accent-text: #D3AEFF; --glow: rgba(168, 85, 247, .45); --glow-2: rgba(194, 122, 62, .16); }
body[data-round="ostacoli"] { --accent: var(--magenta); --accent-text: #FF8CC0; --glow: rgba(219, 39, 119, .42); --glow-2: rgba(234, 211, 176, .1); }
body[data-round="idea"]     { --accent: var(--pink);    --accent-text: #FF9ACB; --glow: rgba(255, 62, 165, .4);  --glow-2: rgba(168, 85, 247, .16); }
body[data-round="fine"]     { --accent: var(--coral);   --accent-text: #FFAA9F; --glow: rgba(255, 122, 107, .36); --glow-2: rgba(205, 235, 63, .12); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; color: var(--text); font: 17px/1.5 var(--body); min-height: 100dvh;
  background: radial-gradient(90% 55% at 30% -8%, var(--glow), transparent 70%), radial-gradient(70% 45% at 95% 5%, var(--glow-2), transparent 70%), var(--bg);
  background-repeat: no-repeat;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sky i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #FFFFFF; opacity: var(--o); animation: tw var(--d) ease-in-out infinite alternate; }
@keyframes tw { to { opacity: .08; } }
.wrap { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding-block: 16px 40px; min-height: 100dvh; display: flex; flex-direction: column; }
#app { display: flex; flex-direction: column; gap: 18px; flex: 1; }
#app.in { animation: dealIn .38s cubic-bezier(.2, .8, .2, 1) backwards; }
#app.in-back { animation: dealBack .38s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes dealIn { from { opacity: 0; transform: translateX(32px); } }
@keyframes dealBack { from { opacity: 0; transform: translateX(-32px); } }

h1, h2, p { margin: 0; }
h1, h2 { font-family: var(--display); text-wrap: balance; }
h1 { font-weight: 700; font-size: clamp(29px, 7.8vw, 38px); line-height: 1.06; letter-spacing: -.015em; }
h2 { font-weight: 600; font-size: clamp(22px, 6vw, 28px); line-height: 1.16; letter-spacing: -.01em; }
h1:focus, h2:focus { outline: none; }
.lead { font-size: 18px; line-height: 1.45; color: var(--muted); }
.kicker { font: 600 12.5px/1.2 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.fine { font-size: 14px; color: var(--muted); }
.hint { font-size: 15px; font-weight: 600; color: var(--accent-text); margin-top: -8px; }
.gradtext { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 3px; }

/* wordmark */
.wordmark { font: 500 clamp(30px, 9vw, 44px)/1 var(--display); letter-spacing: .34em; margin-right: -.34em; text-align: center; }
.wordmark span { background: linear-gradient(90deg, #8B5CF6, #FF3EA5 60%, #FF7A6B); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { text-align: center; font: 500 12.5px/1.3 var(--display); letter-spacing: .28em; text-transform: uppercase; }
.tagline span { color: var(--purple); }
.rulegrad { height: 2px; background: var(--grad); border-radius: 2px; }

/* top bar: back + constellation of stars (one per question) */
.top { display: flex; align-items: center; gap: 14px; min-height: 36px; }
.back { flex: none; background: none; border: 0; color: var(--muted); font: 600 15px var(--body); padding: 6px 2px; cursor: pointer; }
.pips { flex: 1; min-width: 0; display: flex; gap: 8px; justify-content: flex-end; }
.pipgroup { display: flex; gap: 1px; min-width: 0; }
.pip { width: 11px; min-width: 4px; flex: 0 1 11px; height: 11px; background: var(--line);
  clip-path: polygon(50% 0, 63% 36%, 100% 38%, 70% 61%, 80% 100%, 50% 77%, 20% 100%, 30% 61%, 0 38%, 37% 36%); }
.pip.done { background: var(--c); }
.pip.now { background: #FFFFFF; animation: twinkle 1s ease-in-out infinite alternate; }
@keyframes twinkle { to { transform: scale(1.3); } }

/* HUD: Pet Avatar, AI-style speech bubble, kibble counter */
.hud { display: flex; align-items: center; gap: 12px; }
.mascot {
  flex: none; height: 62px; min-width: 62px; padding-inline: 3px; border-radius: 999px;
  background: radial-gradient(circle at 50% 30%, #4A2585, #1D1233 70%); border: 2px solid rgba(201, 166, 255, .45);
  box-shadow: 0 0 22px rgba(124, 58, 237, .45); display: flex; align-items: center; justify-content: center;
}
.mascot svg { width: 54px; height: 57px; display: block; }
.mascot.duo svg { width: 44px; height: 47px; }
.mascot.duo svg + svg { margin-left: -10px; }
.mascot.hop { animation: hop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hop { 40% { transform: translateY(-12px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
.bubble {
  position: relative; flex: 1; min-width: 0; background: var(--violet); color: #FFFFFF;
  border-radius: 16px 16px 16px 4px; padding: 7px 12px; font: 600 15px/1.3 var(--body);
}
.bubble.say { animation: say .35s ease-out; }
@keyframes say { from { transform: scale(.85); opacity: .3; } }
.kib {
  position: relative; flex: none; display: flex; align-items: center; gap: 5px; background: var(--surface); color: var(--text);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; font: 700 17px/1.2 var(--display); font-variant-numeric: tabular-nums;
}
.kib svg { width: 20px; height: 20px; color: #C88A5A; }
.kib .float { position: absolute; right: 2px; top: -6px; font: 800 18px var(--display); color: var(--gold); animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
@keyframes floatUp { from { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-30px); } }

/* universe map */
.map { position: relative; flex: none; height: 340px; margin-inline: 4px; }
.map .orbit { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pl { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; width: 120px; }
.pl .body { width: 60px; height: 60px; transition: transform .4s; }
.pl .body svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px var(--c)); }
.pl.future .body { opacity: .32; filter: saturate(.3); }
.pl.now .body { width: 84px; height: 84px; animation: float 3.2s ease-in-out infinite; }
.pl.now .body svg { filter: drop-shadow(0 0 20px var(--c)); }
@keyframes float { 50% { transform: translateY(-5px) rotate(3deg); } }
.pl span { font: 600 12.5px/1.15 var(--display); color: var(--muted); text-align: center; white-space: nowrap; }
.pl.now span { color: var(--text); font-size: 14px; }
.pl.future span { opacity: .55; }
.star { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; background: #3A3550;
  clip-path: polygon(50% 0, 63% 36%, 100% 38%, 70% 61%, 80% 100%, 50% 77%, 20% 100%, 30% 61%, 0 38%, 37% 36%); }
.star.on { background: var(--c); filter: drop-shadow(0 0 4px var(--c)); animation: lightUp .5s ease-out backwards; }
@keyframes lightUp { from { transform: scale(2.4); opacity: 0; } }
.ship { position: absolute; z-index: 3; transform: translate(-50%, -50%); transition: left 1.3s cubic-bezier(.5, 0, .3, 1), top 1.3s cubic-bezier(.5, 0, .3, 1); }
.ship .mascot { height: 50px; min-width: 50px; animation: drift 2.6s ease-in-out infinite; }
.ship .mascot svg { width: 44px; height: 46px; }
.ship .mascot.duo svg { width: 36px; height: 38px; }
@keyframes drift { 50% { transform: translateY(-4px) rotate(-4deg); } }

/* progress: level bar + avatar ring */
.progress { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.ring { flex: none; position: relative; width: 66px; height: 66px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px var(--display); font-variant-numeric: tabular-nums; }
.levelbar { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.levelbar .lv { display: flex; justify-content: space-between; gap: 10px; font: 600 14.5px var(--body); }
.levelbar .lv span:last-child { color: var(--muted); text-align: right; }
.levelbar .sub { font-size: 13.5px; color: var(--muted); }
.track { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; width: var(--w); background: var(--grad); border-radius: 999px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }

/* toast + confetti */
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 60; transform: translateX(-50%);
  background: var(--grad); color: #FFFFFF; border-radius: 999px; box-shadow: 0 8px 30px rgba(255, 62, 165, .35);
  padding: 7px 18px; font: 700 16px var(--display); white-space: nowrap; animation: toast 2.6s ease forwards; pointer-events: none;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20px) scale(.9); } 12%, 85% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti i { position: absolute; top: -24px; left: var(--x); width: 12px; height: 12px; background: var(--c); animation: fall var(--d) cubic-bezier(.3, .2, .6, 1) var(--w) forwards;
  clip-path: polygon(50% 0, 63% 36%, 100% 38%, 70% 61%, 80% 100%, 50% 77%, 20% 100%, 30% 61%, 0 38%, 37% 36%); }
.confetti i.paw { width: 18px; height: 18px; background: none; color: var(--c); clip-path: none; }
.confetti i.paw svg { width: 100%; height: 100%; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

/* intro */
.cover { display: flex; flex-direction: column; gap: 12px; }
.pets { position: relative; width: min(100%, 320px); aspect-ratio: 520 / 425; max-width: 100%; align-self: center; margin-bottom: -8px; }
.pets img { width: 100%; height: 100%; object-fit: cover; display: block;
  -webkit-mask-image: radial-gradient(closest-side at 50% 48%, #000 62%, transparent 100%); mask-image: radial-gradient(closest-side at 50% 48%, #000 62%, transparent 100%);
  animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.system { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-items: end; }
.system figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; animation: rise .5s ease-out backwards; animation-delay: calc(var(--i) * 90ms + 150ms); }
.system svg { width: 100%; max-width: 58px; height: auto; aspect-ratio: 1; overflow: visible; filter: drop-shadow(0 0 9px var(--c)); }
.system figcaption { font: 600 11.5px/1.15 var(--display); color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font: 600 14.5px/1.4 var(--body); color: var(--muted); }
.panel { border-radius: 18px; padding: 15px 16px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.panel b.t { font: 600 18px var(--display); }
.panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.panel ul strong { color: var(--text); font-weight: 600; }
.gborder { border: 2px solid transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; }

/* buttons */
.btn {
  width: 100%; cursor: pointer; border: 0; border-radius: 14px; padding: 15px 22px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--violet); color: #FFFFFF; font: 600 19px/1.2 var(--display);
  box-shadow: 0 4px 0 #4C1D95, 0 10px 26px rgba(124, 58, 237, .35); transition: transform .1s, box-shadow .1s, opacity .2s;
}
.btn.grad { background: var(--grad); box-shadow: 0 4px 0 #6B1B4F, 0 10px 30px rgba(255, 62, 165, .3); }
.btn::after { content: "→"; font-size: 20px; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #4C1D95; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:disabled::after { content: none; }
.btn.busy { cursor: progress; }
.push { margin-top: auto; }
.row { display: flex; flex-direction: column; gap: 10px; }

/* planet intro */
.roundhero { display: flex; flex-direction: column; gap: 12px; }
.unlock { display: flex; align-items: center; gap: 14px; border-radius: 18px; padding: 12px 14px; animation: unlockIn .6s cubic-bezier(.2, 1.4, .4, 1) backwards; }
@keyframes unlockIn { from { opacity: 0; transform: scale(.6) rotate(-6deg); } }
.unlock b { font: 700 18px/1.15 var(--display); display: block; }
.unlock p { font-size: 15px; color: var(--muted); }

/* stickers */
.sticker {
  flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--c); color: #FFFFFF;
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px rgba(255, 255, 255, .25), 0 6px 18px rgba(0, 0, 0, .5); display: grid; place-items: center; transform: rotate(-7deg);
}
.sticker svg { width: 30px; height: 30px; }
.sticker.locked { background: var(--surface-2); color: #5A5675; box-shadow: inset 0 0 0 1.5px var(--line); transform: none; }
.unlock .sticker { animation: spin .9s .25s cubic-bezier(.2, 1.3, .4, 1) backwards; }
@keyframes spin { from { transform: rotate(-200deg) scale(.3); } }
.album { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
.album figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.album figcaption { font: 600 12.5px/1.2 var(--body); color: var(--muted); overflow-wrap: anywhere; }
.album .locked + figcaption { color: #5A5675; }

/* incoming signal (planet 4) */
.signal { width: 100%; cursor: pointer; text-align: left; color: var(--text); font: inherit; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.signal .sh { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); }
.signal .sh svg { width: 26px; height: 26px; color: var(--pink); flex: none; }
.signal .waves { display: flex; gap: 3px; align-items: center; height: 22px; }
.signal .waves i { width: 4px; border-radius: 2px; background: var(--grad); height: 30%; animation: wave .9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -110ms); }
@keyframes wave { to { height: 100%; } }
.signal .tap { align-self: flex-start; font: 600 14.5px var(--body); background: var(--surface-2); border-radius: 999px; padding: 3px 13px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.signal p { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 12px 14px; min-height: 3em; }
.signal.on { cursor: default; }

/* question */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tagchip { display: inline-flex; align-items: center; gap: 7px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-text); border-radius: 999px; padding: 3px 12px 3px 5px; font: 600 14px/1.4 var(--body); }
.tagchip svg { width: 22px; height: 22px; overflow: visible; }
.count { font: 600 14px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--text); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 12px 14px 12px 12px; font: 500 16.5px/1.35 var(--body); box-shadow: 0 4px 0 #000;
  transition: transform .12s, box-shadow .12s, background-color .15s, border-color .15s, opacity .2s;
  animation: rise .34s ease-out backwards; animation-delay: calc(var(--i) * 40ms + 60ms);
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@media (hover: hover) { .opt:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 0 #000; } }
.opt:active, .opt.sel { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.opt.sel { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border: 2px solid var(--accent); }
.opts.decided .opt:not(.sel) { opacity: .42; }
.opt .n { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-text); font: 700 15px/1 var(--display); }
.opts.multi .opt .n { border-radius: 50%; }
.opt.sel .n { background: var(--accent); color: #FFFFFF; animation: pop .3s ease-out; }
@keyframes pop { 50% { transform: scale(1.25); } }
.opt .n svg { width: 18px; height: 18px; }
.opt.full { opacity: .45; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.bonus { align-self: flex-start; background: var(--gold); color: #1D1A24; border-radius: 999px; padding: 2px 11px; font: 700 13.5px/1.4 var(--display); }

/* scale 1-5 */
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale .opt { justify-content: center; padding: 17px 0 15px; font: 700 28px/1 var(--display); }
.scale .opt.sel { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.ends { display: flex; justify-content: space-between; gap: 12px; font: 600 14px var(--body); color: var(--muted); margin-top: -6px; }
.ends span:last-child { text-align: right; }

/* text */
.field { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); font: 500 17px/1.45 var(--body); padding: 13px 14px; }
.field::placeholder { color: #6E6A8A; }
textarea.field { min-height: 140px; resize: vertical; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { align-self: center; background: none; border: 0; color: var(--muted); font: 600 15px var(--body); text-decoration: underline; text-underline-offset: 4px; padding: 8px 4px; cursor: pointer; }
.error { background: rgba(219, 39, 119, .14); color: #FF9ACB; border: 1.5px solid var(--magenta); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.note { border-radius: 14px; padding: 10px 14px; background: var(--surface-2); color: var(--muted); font-weight: 500; border-left: 3px solid var(--accent); }
.testbar { background: var(--surface-2); color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 12px; }

/* review */
.tally { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tcard { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center; }
.tcard svg { width: 34px; height: 34px; overflow: visible; filter: drop-shadow(0 0 6px var(--c)); }
.tcard span { font: 600 11px/1.15 var(--body); color: var(--muted); overflow-wrap: anywhere; }
.tcard b { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; }

/* thanks */
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.hero .mascot { height: 132px; min-width: 132px; box-shadow: 0 0 50px rgba(168, 85, 247, .55); animation: hop 1s .3s cubic-bezier(.3, 1.6, .5, 1) 2; }
.hero .mascot svg { width: 114px; height: 120px; }
.hero .mascot.duo svg { width: 92px; height: 97px; }
.card { border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; animation: flipIn .7s .2s cubic-bezier(.2, .8, .2, 1) backwards; }
.card.later { animation-delay: .4s; }
@keyframes flipIn { from { opacity: 0; transform: perspective(900px) rotateY(60deg); } }
.stylehead { display: flex; gap: 14px; align-items: center; }
.emblem { flex: none; width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; background: var(--c); color: #FFFFFF; }
.emblem svg { width: 32px; height: 32px; }
.stylename { font: 700 26px/1.05 var(--display); }
.small { font-size: 14px; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { background: var(--surface-2); border-radius: 999px; padding: 3px 11px; font: 600 14px/1.4 var(--body); }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .paws { display: flex; gap: 6px; }
.meter .paws svg { width: 26px; height: 26px; color: var(--surface-2); }
.meter .paws svg.on { color: var(--pink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.stat b { font: 700 23px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.linkbox { display: flex; gap: 8px; }
.linkbox input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 10px; font: 500 14px var(--body); background: var(--surface-2); color: var(--text); }
.linkbox button { flex: none; border: 0; border-radius: 12px; background: var(--violet); color: #FFFFFF; font: 600 15px var(--display); padding: 6px 16px; cursor: pointer; }

@media (max-width: 380px) { .bubble { font-size: 14px; } .album { grid-template-columns: repeat(3, 1fr); } .pl span { font-size: 11.5px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

/* ---------- Stato ---------- */
function byId(id) { return QUESTIONS.find(q => q.id === id); }
function rid() { return Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }
function load() { try { const v = localStorage.getItem(STORE); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* storage non disponibile: il gioco funziona comunque */ } }
function fresh() { return { at: "intro", answers: {}, seen: {}, got: {}, pts: 0, decoded: 0, rid: rid(), t0: Date.now(), sent: 0, secs: 0, from: "" }; }
function reducedMotion() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }

const hot = window.claude && window.claude.hot;
let state = (hot && hot.data && hot.data.state) || load() || fresh();
if (!state.answers || !state.rid || !state.got) state = fresh();
if (hot && hot.snapshot) hot.snapshot(() => ({ state: state }));

let say = "", gain = 0, celebrate = "", levelUp = "";
const app = document.getElementById("app");
const testMode = !FORM_ACTION || !FORM_ENTRY;
document.getElementById("testbar").hidden = !testMode;

(function sky() {
  let h = "";
  for (let i = 0; i < 70; i++) {
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + "%;top:" + (Math.random() * 100).toFixed(1) + "%;--s:" + (Math.random() < .15 ? 2.5 : 1.4) + "px;--o:" + (.25 + Math.random() * .6).toFixed(2) + ";--d:" + (1.8 + Math.random() * 3).toFixed(1) + 's"></i>';
  }
  document.getElementById("sky").innerHTML = h;
})();

function visible(q) { return !q.show || q.show(state.answers); }
function roundQs(r) { return QUESTIONS.filter(q => q.round === r && visible(q)); }
function steps() {
  const s = ["intro"];
  ORDER.forEach(r => { s.push("r:" + r); roundQs(r).forEach(q => s.push("q:" + q.id)); });
  s.push("review");
  return s;
}
function hasAnswer(q) {
  const v = state.answers[q.id];
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "text" || q.type === "long") return typeof v === "string" && v.trim() !== "";
  return typeof v === "number";
}
/* Dopo l'invio il contatto (q41) viene cancellato dal browser, ma la stella resta accesa. */
function done(q) { return hasAnswer(q) || (q.optional && state.seen[q.id]) || (q.contact && !!state.sent); }
function roundDone(r) { return roundQs(r).every(done); }
function roundsDone() { let n = 0; for (const r of ORDER) { if (roundDone(r)) n++; else break; } return n; }
function level(p) { let L = LEVELS[0], next = null; LEVELS.forEach((l, i) => { if (p >= l[0]) { L = l; next = LEVELS[i + 1] || null; } }); return { name: L[1], from: L[0], next: next }; }
function starsLit() { return QUESTIONS.filter(q => visible(q) && done(q)).length; }

function scene(round) { if (round) document.body.setAttribute("data-round", round); else document.body.removeAttribute("data-round"); }
function animate() { app.classList.remove("in", "in-back"); void app.offsetWidth; app.classList.add(dir > 0 ? "in" : "in-back"); }
function focusHead() { const h = app.querySelector("h1, h2"); if (h) h.focus({ preventScroll: true }); window.scrollTo(0, 0); }

function go(d) {
  clearTimeout(advanceTimer); clearInterval(typeTimer);
  const s = steps();
  let i = s.indexOf(state.at);
  if (i < 0) i = 0;
  const cur = state.at;
  let fromRound = "";
  if (cur.indexOf("q:") === 0) {
    const q = byId(cur.slice(2));
    fromRound = q.round;
    state.seen[q.id] = 1;
    if (d > 0 && hasAnswer(q) && !state.got[q.id]) {
      const before = level(state.pts).name;
      state.got[q.id] = 1;
      gain = q.optional ? 25 : 10;
      state.pts += gain;
      const after = level(state.pts).name;
      if (after !== before) levelUp = after;
    }
  }
  i = Math.min(Math.max(i + d, 0), s.length - 1);
  state.at = s[i]; dir = d; sendError = "";
  state.from = d > 0 && fromRound ? fromRound : "";
  if (d > 0 && fromRound && (state.at.indexOf("r:") === 0 || state.at === "review") && roundDone(fromRound) && !state.got["round:" + fromRound]) {
    state.got["round:" + fromRound] = 1;
    celebrate = fromRound;
  }
  save(); render();
}

function pips() {
  let html = '<div class="pips" aria-hidden="true">';
  ORDER.forEach(r => {
    html += '<div class="pipgroup" style="--c: ' + ROUNDS[r].c + '">';
    roundQs(r).forEach(q => {
      const cls = state.at === "q:" + q.id ? "pip now" : (done(q) ? "pip done" : "pip");
      html += '<span class="' + cls + '"></span>';
    });
    html += "</div>";
  });
  return html + "</div>";
}
function hud(text, noMascot) {
  return '<div class="hud">' + (noMascot ? "" : mascotHTML("mascot")) +
    '<div class="bubble" id="bubble">' + esc(text) + "</div>" +
    '<div class="kib" id="kib" aria-label="' + state.pts + ' crocchette">' + BOWL + '<span id="pts">' + state.pts + "</span></div></div>";
}
function topbar(text, noMascot) {
  return '<div class="top"><button class="back" id="back" type="button">&larr; Indietro</button>' + pips() + "</div>" + hud(text, noMascot);
}
function bindBack() { const b = document.getElementById("back"); if (b) b.onclick = () => go(-1); }
function react(text) {

  if (m) { m.classList.remove("hop"); void m.offsetWidth; m.classList.add("hop"); }
  if (b) { b.textContent = text; b.classList.remove("say"); void b.offsetWidth; b.classList.add("say"); }
}
function afterRender() {
  if (gain) {
    const k = document.getElementById("kib");
    if (k) { const f = document.createElement("span"); f.className = "float"; f.textContent = "+" + gain; k.appendChild(f); setTimeout(() => f.remove(), 1200); }

}
function toast(text) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2700);
}
function confetti(n) {
  if (reducedMotion()) return;
  const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  const cols = ["#7C3AED", "#A855F7", "#DB2777", "#FF3EA5", "#FF7A6B", "#F7C948", "#EEEEFF", "#CDEB3F"];
  let html = "";

    const paw = i % 4 === 0;
    html += '<i class="' + (paw ? "paw" : "") + '" style="--x:' + (Math.random() * 100) + "%;--c:" + pick(cols) + ";--d:" + (1.4 + Math.random() * 1.2).toFixed(2) +
      "s;--w:" + (Math.random() * .4).toFixed(2) + "s;--r:" + Math.round(360 + Math.random() * 540) + "deg;--dx:" + Math.round(Math.random() * 120 - 60) + 'px">' + (paw ? PAW : "") + "</i>";
  }

/* ---------- Mappa dell'universo ---------- */
const POS = { pet: [22, 13], bisogni: [74, 30], ostacoli: [26, 50], idea: [74, 69], fine: [30, 88] };
function shipAt(r) { const p = POS[r]; return [p[0] + (p[0] < 50 ? 26 : -26), p[1] - 7]; }
function mapHTML(current, final) {
  const pts = ORDER.map(r => POS[r]);
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 1; i < pts.length; i++) d += " C" + pts[i - 1][0] + " " + (pts[i - 1][1] + 11) + " " + pts[i][0] + " " + (pts[i][1] - 11) + " " + pts[i][0] + " " + pts[i][1];
  let h = '<div class="map" id="map"><svg class="orbit" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="og" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7"/><stop offset=".6" stop-color="#FF3EA5"/><stop offset="1" stop-color="#FF7A6B"/></linearGradient></defs>' +
    '<path d="' + d + '" fill="none" stroke="url(#og)" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".7"/></svg>';
  const curN = current ? ROUNDS[current].n : 6;
  ORDER.forEach(r => {
    const R = ROUNDS[r], p = POS[r];
    const st = final || R.n < curN ? "past" : R.n === curN ? "now" : "future";
    const qs = roundQs(r);
    const rad = st === "now" ? 52 : 40;
    qs.forEach((q, i) => {
      const ang = Math.PI * (1.12 + .76 * (qs.length === 1 ? .5 : i / (qs.length - 1)));
      h += '<i class="star' + (done(q) ? " on" : "") + '" style="--c:' + R.c + ";left:calc(" + p[0] + "% + " + (Math.cos(ang) * rad).toFixed(1) + "px);top:calc(" + p[1] + "% + " + (Math.sin(ang) * rad).toFixed(1) + 'px)"></i>';
    });
    h += '<div class="pl ' + st + '" style="left:' + p[0] + "%;top:" + p[1] + "%;--c:" + R.c + '"><div class="body">' + planet(r) + "</div><span>" + esc(R.planet) + "</span></div>";
  });
  const target = current || "fine";
  const from = state.from && state.from !== target ? state.from : target;
  const s0 = shipAt(from);
  h += '<div class="ship" id="ship" data-to="' + target + '" style="left:' + s0[0] + "%;top:" + s0[1] + '%">' + mascotHTML("mascot") + "</div>";
  return h + "</div>";
}
function flyShip() {
  const sh = document.getElementById("ship");
  if (!sh) return;
  const t = shipAt(sh.getAttribute("data-to"));
  requestAnimationFrame(() => requestAnimationFrame(() => { sh.style.left = t[0] + "%"; sh.style.top = t[1] + "%"; }));
  state.from = ""; save();
}

function render() {
  const at = state.at;
  if (state.sent) renderThanks();
  else if (at === "intro") renderIntro();
  else if (at === "review") renderReview();
  else if (at.indexOf("r:") === 0) renderRound(at.slice(2));
  else { const q = byId(at.slice(2)); if (q && visible(q)) renderQuestion(q); else { state.at = "intro"; renderIntro(); } }
  animate();
  afterRender();
}

function unlockHTML(r) {
  const S = STICKERS[r];
  return '<div class="unlock gborder"><div class="sticker" style="--c:' + S.c + '">' + S.svg + "</div>" +
    "<div><b>Accessorio sbloccato: " + esc(S.name) + "</b><p>Pianeta " + esc(ROUNDS[r].planet) + " esplorato. Il tuo Pet Avatar lo indossa già.</p></div></div>";
}
function progressHTML() {
  const L = level(state.pts);
  const w = L.next ? Math.round(100 * (state.pts - L.from) / (L.next[0] - L.from)) : 100;
  const pct = Math.round(100 * roundsDone() / 5);
  const C = 2 * Math.PI * 27;
  return '<div class="progress"><div class="ring" aria-label="Pet Avatar completo al ' + pct + '%">' +
    '<svg viewBox="0 0 66 66" aria-hidden="true"><defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset=".6" stop-color="#FF3EA5"/><stop offset="1" stop-color="#FF7A6B"/></linearGradient></defs>' +
    '<circle cx="33" cy="33" r="27" fill="none" stroke="#1F1C2E" stroke-width="7"/>' +
    '<circle cx="33" cy="33" r="27" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C * pct / 100).toFixed(1) + " " + C.toFixed(1) + '"/></svg>' +
    "<b>" + pct + "%</b></div>" +
    '<div class="levelbar"><div class="lv"><span>' + esc(L.name) + "</span><span>" + (L.next ? (L.next[0] - state.pts) + " al prossimo" : "Livello massimo") + "</span></div>" +
    '<div class="track"><i style="--w:' + w + '%"></i></div><span class="sub">' + starsLit() + " stelle accese · Pet Avatar al " + pct + "%</span></div></div>";

    (cel ? unlockHTML(cel) : "") +
    mapHTML(r) +

function typeHint(q) {
  if (q.type === "single") return "Una sola risposta";
  if (q.type === "multi") return q.max ? "Fino a " + q.max + " risposte" : "Scegli tutte quelle che valgono";
  if (q.type === "scale") return "Da 1 a 5";
  return q.optional ? "Facoltativa" : "";
}

function renderQuestion(q) {
  scene(q.round);
  const R = ROUNDS[q.round];
  const list = roundQs(q.round);
  const pos = list.indexOf(q) + 1;
  const note = q.note ? q.note(state.answers) : "";
  const left = list.length - pos;
  const greet = say || (species()[0] === "mystery" ? SAYS.mystery[0] : left === 0 ? "Ultima stella del Pianeta " + R.planet + "!" : pos === 1 ? "Atterrati! Accendiamo le stelle." : pick(["Tocca a te!", "Scegli con calma.", "Io aspetto qui.", left + " stelle alla fine del pianeta."]));
  let body = "";

  if (q.type === "single") {
    const v = state.answers[q.id];
    body = '<div class="opts' + (typeof v === "number" ? " decided" : "") + '" role="radiogroup">' +
      q.opts.map((t, i) => '<button type="button" role="radio" class="opt' + (v === i ? " sel" : "") + '" aria-checked="' + (v === i) + '" data-i="' + i + '" style="--i:' + i + '">' +
        '<span class="n">' + (v === i ? CHECK : String.fromCharCode(65 + i)) + "</span><span>" + esc(t) + "</span></button>").join("") + "</div>";
  } else if (q.type === "multi") {
    const v = state.answers[q.id] || [];
    body = '<div class="opts multi" role="group">' +
      q.opts.map((t, i) => {
        const sel = v.indexOf(i) >= 0;
        const full = q.max && v.length >= q.max && !sel;
        return '<button type="button" class="opt' + (sel ? " sel" : "") + (full ? " full" : "") + '" aria-pressed="' + sel + '" data-i="' + i + '" style="--i:' + i + '">' +
          '<span class="n">' + (sel ? CHECK : String.fromCharCode(65 + i)) + "</span><span>" + esc(t) + "</span></button>";
      }).join("") + "</div>" +
      '<button class="btn" id="next" type="button"' + (v.length ? "" : " disabled") + ">" +
      (v.length ? "Avanti · " + v.length + (q.max ? " di " + q.max : "") + (v.length === 1 ? " scelta" : " scelte") : "Scegli almeno una risposta") + "</button>";
  } else if (q.type === "scale") {
    const v = state.answers[q.id];
    body = '<div class="scale" role="radiogroup">' +
      [1, 2, 3, 4, 5].map((n, i) => '<button type="button" role="radio" class="opt' + (v === n ? " sel" : "") + '" aria-checked="' + (v === n) + '" aria-label="' + n + ' su 5" data-i="' + n + '" style="--i:' + i + '">' + n + "</button>").join("") +
      '</div><div class="ends"><span>1 · ' + esc(q.ends[0]) + "</span><span>5 · " + esc(q.ends[1]) + "</span></div>";
  } else {
    const v = state.answers[q.id] || "";
    const field = q.type === "long"
      ? '<textarea class="field" id="f_' + q.id + '" placeholder="' + esc(q.placeholder || "") + '">' + esc(v) + "</textarea>"
      : '<input class="field" id="f_' + q.id + '" type="text" autocomplete="off" placeholder="' + esc(q.placeholder || "") + '" value="' + esc(v) + '">';
    body = '<label for="f_' + q.id + '" class="hint" style="margin:0">' + (q.optional ? "Risposta facoltativa" : "Risposta breve") + "</label>" + field +
      '<div id="err" class="error" hidden></div>' +
      '<div class="row"><button class="btn" id="next" type="button">Avanti</button>' +
      (q.optional ? '<button class="skip" id="skip" type="button">Salta questa domanda</button>' : "") + "</div>";
  }

  app.innerHTML = topbar(greet) +
    '<div class="qhead"><span class="tagchip" style="--c:' + R.c + '">' + planet(q.round) + esc(q.tag) + '</span><span class="count">Stella ' + pos + " / " + list.length + "</span></div>" +
    '<h2 tabindex="-1">' + esc(q.prompt) + "</h2>" +
    (typeHint(q) ? '<p class="hint">' + typeHint(q) + "</p>" : "") +
    (q.optional && !state.got[q.id] ? '<span class="bonus">Stella bonus · +25 se rispondi</span>' : "") +
    (note ? '<p class="note">' + esc(note) + "</p>" : "") +
    body;
  bindBack();

  const cheer = () => pick(SAYS[sayKey()] || SAYS.hamster);

  if (q.type === "single" || q.type === "scale") {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = Number(b.getAttribute("data-i"));
      const before = sayKey();
      state.answers[q.id] = i;
      save();
      app.querySelectorAll(".opt").forEach(x => { const on = x === b; x.classList.toggle("sel", on); x.setAttribute("aria-checked", on); });
      app.querySelector(".opts, .scale").classList.add("decided");
      if (q.type === "single") app.querySelectorAll(".opt .n").forEach((n, k2) => { n.innerHTML = k2 === i ? CHECK : String.fromCharCode(65 + k2); });
      if (sayKey() !== before) {
        const m = document.getElementById("mascot");
        if (m) m.outerHTML = mascotHTML("mascot");
        const sp = species();
        say = sp.length > 1 ? (sp[0] === "dog" ? "Siamo in due! Bau! Miao!" : "Squame o piume? Lo scopriamo subito!") : "Eccomi, sono il tuo Pet Avatar!";
      } else say = cheer();
      react(say);
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => go(1), reducedMotion() ? 150 : 650);
    });
  } else if (q.type === "multi") {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = Number(b.getAttribute("data-i"));
      let v = (state.answers[q.id] || []).slice();
      const excl = q.excl || [];
      if (v.indexOf(i) >= 0) v = v.filter(x => x !== i);
      else {
        if (excl.indexOf(i) >= 0) v = [i];
        else {
          v = v.filter(x => excl.indexOf(x) < 0);
          if (q.max && v.length >= q.max) {
            const n = document.getElementById("next"); n.classList.remove("shake"); void n.offsetWidth; n.classList.add("shake");
            n.textContent = "Massimo " + q.max + ": togline una"; react("Ehi, massimo " + q.max + "!"); return;
          }
          v.push(i);
        }
      }
      state.answers[q.id] = v.sort((a, b2) => a - b2);
      save();
      const y = window.scrollY;
      say = v.length ? cheer() : "Scegli almeno una risposta.";
      renderQuestion(q);
      app.querySelectorAll(".opt").forEach(x => x.style.animation = "none");
      react(say);
      window.scrollTo(0, y);
    });
    document.getElementById("next").onclick = () => { say = cheer(); go(1); };
  } else {
    const f = document.getElementById("f_" + q.id);
    const err = document.getElementById("err");
    f.oninput = () => { state.answers[q.id] = f.value; save(); err.hidden = true; };
    if (q.type === "text") f.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("next").click(); } };
    document.getElementById("next").onclick = () => {
      const val = f.value.trim();
      if (!q.optional && !val) { err.textContent = "Scrivi un contatto per continuare, oppure torna indietro e scegli «No»."; err.hidden = false; return; }
      if (q.contact && !(/\S+@\S+\.\S+/.test(val) || val.replace(/\D/g, "").length >= 6)) { err.textContent = "Inserisci un'email (nome@esempio.it) o un numero di telefono."; err.hidden = false; return; }
      say = val ? (q.optional ? "Stella bonus! Grazie." : cheer()) : "";
      go(1);
    };
    const sk = document.getElementById("skip");
    if (sk) sk.onclick = () => { delete state.answers[q.id]; say = "Nessun problema, avanti."; go(1); };
    if (!matchMedia("(hover: none)").matches) f.focus({ preventScroll: true });
    return;
  }
  focusHead();
}

function missing() { return QUESTIONS.filter(q => visible(q) && !q.optional && !hasAnswer(q)); }

function renderReview() {
  scene(null);
  const cel = celebrate; celebrate = "";
  let tally = '<div class="tally">';
  ORDER.forEach(r => {
    const qs = roundQs(r);
    tally += '<div class="tcard" style="--c: ' + ROUNDS[r].c + '">' + planet(r) + "<span>" + esc(ROUNDS[r].planet) + "</span><b>" + qs.filter(done).length + "/" + qs.length + "</b></div>";
  });
  tally += "</div>";
  const miss = missing();
  app.innerHTML = topbar(miss.length ? "Manca qualche stella, ti aspetto." : "Che viaggio! Rientriamo alla base?") +
    (cel ? unlockHTML(cel) : "") +
    '<p class="kicker">Rientro alla base</p>' +
    '<h1 tabindex="-1">Pronto a inviare le tue risposte?</h1>' +
    '<p class="lead">' + (miss.length ? "Manca ancora qualche risposta obbligatoria. Toccala qui sotto per completarla." : "Hai esplorato tutti e cinque i pianeti. Invia le risposte per registrarle e vedere il tuo universo completo.") + "</p>" +
    tally + progressHTML() +
    (miss.length ? '<div class="opts">' + miss.map((q, i) => '<button type="button" class="opt" data-q="' + q.id + '" style="--i:' + i + '"><span class="n">!</span><span>' + esc(q.prompt) + "</span></button>").join("") + "</div>" : "") +
    (sendError ? '<div class="error">' + esc(sendError) + "</div>" : "") +
    '<button class="btn grad push" id="send" type="button"' + (miss.length ? " disabled" : "") + ">Invia le risposte</button>" +
    '<p class="fine">Puoi ancora tornare indietro e cambiare qualsiasi risposta.</p>';
  bindBack();
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { state.at = "q:" + b.getAttribute("data-q"); dir = -1; save(); render(); });
  document.getElementById("send").onclick = send;
  if (cel) setTimeout(() => confetti(), 150);
  focusHead();
}

function payload() {
  const a = {};
  QUESTIONS.forEach(q => {
    if (!visible(q) || !hasAnswer(q)) return;
    const v = state.answers[q.id];
    const key = q.id.slice(1);
    if (q.type === "single") a[key] = q.opts[v];
    else if (q.type === "multi") a[key] = v.map(i => q.opts[i]);
    else if (q.type === "scale") a[key] = v;
    else a[key] = v.trim();
  });
  return JSON.stringify({ form: "A", v: "2.0", rid: state.rid, secs: state.secs, a: a });
}

function send() {
  if (busy) return;
  const btn = document.getElementById("send");
  busy = true; btn.disabled = true; btn.classList.add("busy"); btn.textContent = "Invio in corso…";
  state.secs = Math.round((Date.now() - state.t0) / 1000);
  const finish = ok => {
    busy = false;
    if (ok) { state.sent = Date.now(); delete state.answers.q41; save(); dir = 1; render(); confetti(60); }
    else { sendError = "Non siamo riusciti a inviare le risposte. Controlla la connessione e riprova."; renderReview(); }
  };
  if (testMode) { console.log("[PetVerse] payload di prova:", payload()); setTimeout(() => finish(true), 500); return; }
  const body = new URLSearchParams();
  body.append(FORM_ENTRY, payload());
  fetch(FORM_ACTION, { method: "POST", mode: "no-cors", body: body }).then(() => finish(true), () => finish(false));
}

function profileOf() {
  const a = state.answers;
  const src = a.q23 || [];
  const tools = (a.q29 || []).filter(i => i !== 6 && i !== 7);
  const digital = tools.length + (src.indexOf(7) >= 0 ? 1 : 0) + (src.indexOf(8) >= 0 ? 1 : 0);
  if (digital >= 3) return "digitale";
  if (src.indexOf(0) >= 0 && src.length <= 2) return "fedele";
  if (src.length >= 4) return "esploratore";
  return "pratico";
}

function renderThanks() {
  scene(null);
  const P = PROFILES[profileOf()];
  const a = state.answers;
  const facts = [];
  if (typeof a.q1 === "number") facts.push(byId("q1").opts[a.q1].replace(" (anche di specie diverse)", ""));
  if (typeof a.q4 === "number" && a.q1 === 0) facts.push("taglia " + byId("q4").opts[a.q4].split(" ")[0].toLowerCase());
  if (typeof a.q17 === "number") facts.push(byId("q17").opts[a.q17]);
  if (typeof a.q19 === "number") facts.push(byId("q19").opts[a.q19].split(" (")[0]);
  const lit = starsLit();
  const mins = Math.max(1, Math.round((state.secs || 0) / 60));
  const fit = typeof a.q30 === "number" ? a.q30 : 0;
  let paws = "";
  for (let i = 1; i <= 5; i++) paws += PAW.replace("<svg", '<svg class="' + (i <= fit ? "on" : "") + '"');
  const link = location.href.split("#")[0];
  const all = ORDER.map(r => ({ name: STICKERS[r].name, c: STICKERS[r].c, svg: STICKERS[r].svg, got: roundDone(r) }))
    .concat(BONUS.map(b => ({ name: b.name, c: b.c, svg: b.svg, got: b.got(a) })));
  const gotN = all.filter(s => s.got).length;
  const L = level(state.pts);

  app.innerHTML =
    '<div class="hero">' + mascotHTML() +
    '<p class="kicker">Pet Avatar completo · ' + esc(L.name) + "</p>" +
    '<h1 tabindex="-1">Grazie! La tua risposta è stata <span class="gradtext">registrata</span>.</h1></div>' +
    '<div class="card panel"><div><p class="small">Il tuo universo PetVerse</p><p class="stylename">' + lit + " stelle accese su 5 pianeti</p></div>" + mapHTML(null, true) + "</div>" +
    '<div class="card gborder later" style="--c: ' + P.color + '">' +
      '<div class="stylehead"><div class="emblem">' + icon(P.icon) + "</div>" +
      '<div><p class="small">Il tuo profilo da pet parent</p><p class="stylename">' + esc(P.name) + "</p></div></div>" +
      "<p>" + esc(P.line) + "</p>" +
      (facts.length ? '<div class="facts">' + facts.map(f => '<span class="fact">' + esc(f) + "</span>").join("") + "</div>" : "") +
      (fit ? '<div class="meter"><p class="small">Quanto ti sembra utile l\'idea: ' + fit + ' su 5</p><div class="paws">' + paws + "</div></div>" : "") +
      '<div class="stats"><div class="stat"><b>' + state.pts + '</b><span>crocchette</span></div><div class="stat"><b>' + lit + '</b><span>stelle accese</span></div><div class="stat"><b>' + mins + "′</b><span>minuti</span></div></div>" +
      '<p class="small">Il profilo è solo un gioco: nasce dalle fonti e dagli strumenti che hai scelto.</p>' +
    "</div>" +
    '<div class="card panel later"><div><p class="small">Album degli adesivi</p><p class="stylename">' + gotN + " su " + all.length + "</p></div>" +
      '<div class="album">' + all.map(s => '<figure><div class="sticker' + (s.got ? "" : " locked") + '" style="--c:' + s.c + '">' + s.svg + "</div><figcaption>" + esc(s.got ? s.name : "???") + "</figcaption></figure>").join("") + "</div>" +
      '<p class="small">Gli adesivi segreti premiano chi ha più animali, chi lascia un suggerimento e chi accetta di essere ricontattato.</p>' +
    "</div>" +
    '<div class="panel"><b class="t">Invita altri esploratori</b><p class="small">Conosci altri proprietari di animali? Manda loro il link: più risposte raccogliamo, più la ricerca è solida.</p>' +
      '<div class="linkbox"><input id="share" type="text" readonly value="' + esc(link) + '" aria-label="Link al questionario"><button id="copy" type="button">Copia</button></div></div>' +
    (testMode ? '<button class="skip" id="again" type="button">Gioca di nuovo (solo in modalità prova)</button>' : "");
  document.getElementById("copy").onclick = () => {
    const inp = document.getElementById("share"), b = document.getElementById("copy");
    const ok = () => { b.textContent = "Copiato"; };
    const fallback = () => { inp.focus(); inp.select(); b.textContent = "Premi Ctrl+C"; };
    try { navigator.clipboard.writeText(link).then(ok, fallback); } catch (e) { fallback(); }
  };
  const ag = document.getElementById("again");
  if (ag) ag.onclick = () => { state = fresh(); save(); dir = -1; render(); };
  focusHead();
}

function start() { render(); }
if (hot && hot.ready) hot.ready(start); else start();
</script>
